name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — empty = auto-bump patch'
        required: false
        default: ''
      bump:
        description: 'Bump type if version is empty'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -n "$VERSION_INPUT" ]]; then
            NEW="$VERSION_INPUT"
          elif [[ "$BUMP_TYPE" == "major" ]]; then
            NEW="$((MAJOR+1)).0.0"
          elif [[ "$BUMP_TYPE" == "minor" ]]; then
            NEW="$MAJOR.$((MINOR+1)).0"
          else
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
          fi

          TAG="v$NEW"
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" Cargo.toml
          git add Cargo.toml
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: macos-latest
    env:
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APP_STORE_KEY:        ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      # ── Sanity-check required signing secrets up front ─────────────────────
      - name: Verify macOS signing secrets are present
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -z "${SIGNING_IDENTITY:-}"      ] && missing+=("MACOS_SIGNING_IDENTITY")
          [ -z "${APP_STORE_KEY:-}"        ] && missing+=("APP_STORE_CONNECT_KEY")
          [ -z "${APP_STORE_KEY_ID:-}"     ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}"  ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "${MACOS_CERTIFICATE:-}"     ] && missing+=("MACOS_CERTIFICATE")
          [ -z "${MACOS_CERTIFICATE_PWD:-}" ] && missing+=("MACOS_CERTIFICATE_PWD")
          [ -z "${KEYCHAIN_PASSWORD:-}"     ] && missing+=("KEYCHAIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 7 macOS signing secrets present."

      # ── Import Developer ID cert into a temporary keychain ─────────────────
      - name: Set up signing keychain
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build TUI
        run: cargo build -p ais-monitor-tui --release --target aarch64-apple-darwin --bin ais-monitor-tui

      # ── Sign the binary with hardened runtime + webview entitlements ───────
      - name: Codesign binary
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/ais-monitor
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # ── Sign the TUI binary too (no entitlements needed — pure CLI) ────────
      - name: Codesign TUI binary
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/ais-monitor-tui
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # ── Stage the TUI binary under the binstall-compatible asset name ─────
      - name: Stage TUI binary
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/ais-monitor-tui \
            dist/ais-monitor-tui-aarch64-apple-darwin
          shasum -a 256 dist/ais-monitor-tui-aarch64-apple-darwin \
            > dist/ais-monitor-tui-aarch64-apple-darwin.sha256

      # ── Wrap binary in .app bundle, build signed + notarized + stapled DMG ─
      - name: Build .app + .dmg
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/ais-monitor
          VER="${GITHUB_REF_NAME#v}"
          APP="dist/AIS Monitor.app"

          # 1. Construct the .app bundle around the cargo-built binary.
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/ais-monitor"
          chmod +x "$APP/Contents/MacOS/ais-monitor"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>ais-monitor</string>
            <key>CFBundleIdentifier</key><string>com.ais-monitor.app</string>
            <key>CFBundleName</key><string>AIS Monitor</string>
            <key>CFBundleDisplayName</key><string>AIS Monitor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

          # 2. Re-sign the .app (sign nested binary first via --deep).
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            --deep "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # 3. Stage and create .dmg.
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AIS Monitor" -srcfolder dmg-staging \
            -ov -format UDZO dist/ais-monitor-macos-arm64.dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" \
            dist/ais-monitor-macos-arm64.dmg

          # 4. Notarize the DMG (covers the binary inside via hash) and staple.
          P8="$RUNNER_TEMP/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "$APP_STORE_KEY" | base64 --decode > "$P8"

          xcrun notarytool submit dist/ais-monitor-macos-arm64.dmg \
            --key "$P8" \
            --key-id "$APP_STORE_KEY_ID" \
            --issuer "$APP_STORE_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/ais-monitor-macos-arm64.dmg
          xcrun stapler validate dist/ais-monitor-macos-arm64.dmg

          shasum -a 256 dist/ais-monitor-macos-arm64.dmg \
            > dist/ais-monitor-macos-arm64.dmg.sha256

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-macos-arm64
          path: |
            dist/ais-monitor-macos-arm64.dmg
            dist/ais-monitor-macos-arm64.dmg.sha256

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-tui-aarch64-apple-darwin
          path: |
            dist/ais-monitor-tui-aarch64-apple-darwin
            dist/ais-monitor-tui-aarch64-apple-darwin.sha256

  build-windows:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Build TUI
        run: cargo build -p ais-monitor-tui --release --bin ais-monitor-tui

      - name: Stage TUI binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "ais-monitor-tui-x86_64-pc-windows-msvc.exe"
          Copy-Item "target\release\ais-monitor-tui.exe" "dist\$name" -Force
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "dist\$name.sha256" -Encoding ASCII

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force }
          else { Write-Error "WebView2Loader.dll not found in build output" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc /DMyAppVersion=$version installer\installer.iss
          # Inno now emits a versionless filename so the "/releases/latest/download/"
          # URL is stable across releases. Version info still lives inside the .exe
          # (properties + wizard) and in the app's own title bar.
          $exe = "ais-monitor-setup.exe"
          $hash = (Get-FileHash "dist\$exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File "dist\$exe.sha256" -Encoding ASCII
          Write-Host "Installer: dist\$exe ($([math]::Round((Get-Item dist\$exe).Length/1MB,1)) MB)"

      
      # ── SignPath Foundation: code-sign the .exe for free (OSS only) ────────
      # Uncomment this block after SignPath Foundation has approved the project.
      # Until then the .exe ships unsigned (SmartScreen will warn on download).
      #
      # Setup (one-time, after SignPath approval):
      #   1. Add repo secret `SIGNPATH_API_TOKEN` (from SignPath dashboard).
      #   2. Fill the three placeholders below with values from your
      #      SignPath project page (organization-id, project-slug, policy-slug).
      #
      # - name: Upload unsigned artifact to GitHub
      #   id: upload-unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ais-monitor-windows-unsigned
      #     path: dist/ais-monitor-setup.exe
      #
      # - name: Submit signing request to SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: 'REPLACE-WITH-SIGNPATH-ORG-UUID'
      #     project-slug:    'REPLACE-WITH-SIGNPATH-PROJECT-SLUG'
      #     signing-policy-slug: 'REPLACE-WITH-SIGNPATH-POLICY-SLUG'
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-signed
      #
      # - name: Replace .exe with the signed version
      #   shell: pwsh
      #   run: |
      #     Move-Item -Force dist-signed\ais-monitor-setup.exe dist\ais-monitor-setup.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-windows
          path: |
            dist\ais-monitor-setup.exe
            dist\ais-monitor-setup.exe.sha256

      # ── SignPath Foundation: code-sign the TUI .exe for free (OSS only) ────
      # Uncomment after SignPath Foundation has approved the project. Mirrors
      # the desktop installer block above — same org/project/policy slugs,
      # different artifact. Until then the TUI .exe ships unsigned; SmartScreen
      # will warn on browser-download (curl / cargo binstall / cargo install
      # bypass quarantine, so power-user paths are unaffected).
      #
      # - name: Upload unsigned TUI artifact to GitHub
      #   id: upload-tui-unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ais-monitor-tui-windows-unsigned
      #     path: dist/ais-monitor-tui-x86_64-pc-windows-msvc.exe
      #
      # - name: Submit TUI signing request to SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: 'REPLACE-WITH-SIGNPATH-ORG-UUID'
      #     project-slug:    'REPLACE-WITH-SIGNPATH-PROJECT-SLUG'
      #     signing-policy-slug: 'REPLACE-WITH-SIGNPATH-POLICY-SLUG'
      #     github-artifact-id: ${{ steps.upload-tui-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-tui-signed
      #
      # - name: Replace TUI .exe with signed version
      #   shell: pwsh
      #   run: |
      #     Move-Item -Force `
      #       dist-tui-signed\ais-monitor-tui-x86_64-pc-windows-msvc.exe `
      #       dist\ais-monitor-tui-x86_64-pc-windows-msvc.exe
      #     $hash = (Get-FileHash "dist\ais-monitor-tui-x86_64-pc-windows-msvc.exe" `
      #       -Algorithm SHA256).Hash.ToLower()
      #     "$hash  ais-monitor-tui-x86_64-pc-windows-msvc.exe" `
      #       | Out-File "dist\ais-monitor-tui-x86_64-pc-windows-msvc.exe.sha256" `
      #         -Encoding ASCII

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-tui-x86_64-pc-windows-msvc
          path: |
            dist\ais-monitor-tui-x86_64-pc-windows-msvc.exe
            dist\ais-monitor-tui-x86_64-pc-windows-msvc.exe.sha256

  build-linux:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest

    # x86_64 only — cross-compiling GTK/WebKit for ARM64 Linux requires a full
    # ARM64 sysroot which is impractical on ubuntu-latest runners.

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build TUI
        run: cargo build -p ais-monitor-tui --release --target x86_64-unknown-linux-gnu --bin ais-monitor-tui

      - name: Stage TUI binary
        run: |
          mkdir -p dist
          NAME="ais-monitor-tui-x86_64-unknown-linux-gnu"
          cp target/x86_64-unknown-linux-gnu/release/ais-monitor-tui "dist/$NAME"
          strip "dist/$NAME" || true
          sha256sum "dist/$NAME" > "dist/$NAME.sha256"

      - name: Package tar.gz
        run: |
          NAME="ais-monitor-linux-x86_64"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          cp target/x86_64-unknown-linux-gnu/release/ais-monitor "$DIST/"
          cp scripts/setup-linux.sh "$DIST/"
          chmod +x "$DIST/setup-linux.sh"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-linux-x86_64
          path: |
            ais-monitor-linux-x86_64.tar.gz
            ais-monitor-linux-x86_64.tar.gz.sha256

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-tui-x86_64-unknown-linux-gnu
          path: |
            dist/ais-monitor-tui-x86_64-unknown-linux-gnu
            dist/ais-monitor-tui-x86_64-unknown-linux-gnu.sha256

  release:
    needs: [build-mac, build-windows, build-linux]
    # Mirror the build jobs: skipped `prepare` (the tag-push path doesn't run
    # it) propagates through the default `if: success()` and would skip
    # `release` too. Override so we only skip on genuine failure / cancel.
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts + generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG:  ${{ github.ref_name }}
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

          VER="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          MAC_DMG="ais-monitor-macos-arm64.dmg"
          WIN_MSI="ais-monitor-setup.exe"
          LINUX_TGZ="ais-monitor-linux-x86_64.tar.gz"

          sha() { [ -n "$1" ] && [ -f "release/$1" ] && sha256sum "release/$1" | awk '{print $1}' || echo ""; }

          cat > release/latest.json <<EOF
          {
            "name": "ais-monitor",
            "version": "$VER",
            "tag": "$TAG",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "macos":   { "dmg":    { "url": "$BASE/$MAC_DMG",   "sha256": "$(sha "$MAC_DMG")"   } },
              "windows": { "exe_or_msi": { "url": "$BASE/$WIN_MSI", "sha256": "$(sha "$WIN_MSI")" } },
              "linux":   { "tarball": { "url": "$BASE/$LINUX_TGZ", "sha256": "$(sha "$LINUX_TGZ")" } }
            }
          }
          EOF
          cp release/latest.json artifacts/  # so gh release attaches it
          cat release/latest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          FILES=$(find artifacts -type f | tr '\n' ' ')

          # `--latest` forces this release to be flagged "Latest" in the GitHub
          # UI and via the `/releases/latest` API. Without it, the repo's
          # "latest release preference" (which may be set to manually-pinned)
          # decides — and an old stray `master` release can hang on as latest.
          gh release create "$TAG" \
            --latest \
            --title "ais-monitor $TAG" \
            --notes "$(cat <<'EOF'
          ## Desktop app

          ### macOS (Apple Silicon)
          Download `ais-monitor-macos-arm64.dmg`, open it, and drag AIS Monitor to /Applications.
          Signed with Apple Developer ID and notarized — opens with a normal double-click.

          ### Windows
          Download `ais-monitor-setup.exe` from this release and run it. The same
          URL also serves the latest version directly:
          `https://github.com/${{ github.repository }}/releases/latest/download/ais-monitor-setup.exe`

          ### Linux (x86_64)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ais-monitor-linux-x86_64.tar.gz | tar xz
          cd ais-monitor-linux-x86_64
          sudo ./setup-linux.sh && ./ais-monitor
          ```

          ## Terminal UI (`ais-monitor-tui`)

          **Windows — PowerShell:**
          ```powershell
          Invoke-WebRequest https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install-tui.ps1 -UseBasicParsing | Invoke-Expression
          ```

          **Windows — Command Prompt (cmd.exe):**
          ```cmd
          curl -L -o "%TEMP%\install-tui.ps1" https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install-tui.ps1 && powershell -ExecutionPolicy Bypass -File "%TEMP%\install-tui.ps1"
          ```

          **macOS / Linux:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install-tui.sh | sh
          ```

          **Manual download** (no scripts) — grab `ais-monitor-tui-x86_64-pc-windows-msvc.exe` from the Assets list below, rename to `ais-monitor-tui.exe`, drop in any folder on your PATH, right-click → Properties → **Unblock**.

          Both installers download the matching binary, drop it on PATH, and clear the platform's "downloaded from internet" mark so first run doesn't trigger SmartScreen / Gatekeeper.

          After install:
          ```
          az login
          ais-monitor-tui
          ```

          Headless (SSH, Server Core, no browser): `ais-monitor-tui --device-code`.
          EOF
          )" \
            $FILES
