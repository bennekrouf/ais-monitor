name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — empty = auto-bump patch'
        required: false
        default: ''
      bump:
        description: 'Bump type if version is empty'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -n "$VERSION_INPUT" ]]; then
            NEW="$VERSION_INPUT"
          elif [[ "$BUMP_TYPE" == "major" ]]; then
            NEW="$((MAJOR+1)).0.0"
          elif [[ "$BUMP_TYPE" == "minor" ]]; then
            NEW="$MAJOR.$((MINOR+1)).0"
          else
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
          fi

          TAG="v$NEW"
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" Cargo.toml
          git add Cargo.toml
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: macos-latest
    env:
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID:         ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      APPLE_TEAM_ID:    ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      APPLE_PASSWORD:   ${{ secrets.MACOS_NOTARY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      # ── Sanity-check required signing secrets up front ─────────────────────
      - name: Verify macOS signing secrets are present
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -z "${SIGNING_IDENTITY:-}"      ] && missing+=("MACOS_SIGNING_IDENTITY")
          [ -z "${APPLE_ID:-}"              ] && missing+=("MACOS_NOTARY_APPLE_ID")
          [ -z "${APPLE_TEAM_ID:-}"         ] && missing+=("MACOS_NOTARY_TEAM_ID")
          [ -z "${APPLE_PASSWORD:-}"        ] && missing+=("MACOS_NOTARY_PASSWORD")
          [ -z "${MACOS_CERTIFICATE:-}"     ] && missing+=("MACOS_CERTIFICATE")
          [ -z "${MACOS_CERTIFICATE_PWD:-}" ] && missing+=("MACOS_CERTIFICATE_PWD")
          [ -z "${KEYCHAIN_PASSWORD:-}"     ] && missing+=("KEYCHAIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 7 macOS signing secrets present."

      # ── Import Developer ID cert into a temporary keychain ─────────────────
      - name: Set up signing keychain
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      # ── Sign the binary with hardened runtime + webview entitlements ───────
      - name: Codesign binary
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/ais-monitor
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # ── Wrap binary in .app bundle, build signed + notarized + stapled DMG ─
      - name: Build .app + .dmg
        run: |
          set -euo pipefail
          BIN=target/aarch64-apple-darwin/release/ais-monitor
          VER="${GITHUB_REF_NAME#v}"
          APP="dist/AIS Monitor.app"

          # 1. Construct the .app bundle around the cargo-built binary.
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/ais-monitor"
          chmod +x "$APP/Contents/MacOS/ais-monitor"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>ais-monitor</string>
            <key>CFBundleIdentifier</key><string>com.ais-monitor.app</string>
            <key>CFBundleName</key><string>AIS Monitor</string>
            <key>CFBundleDisplayName</key><string>AIS Monitor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

          # 2. Re-sign the .app (sign nested binary first via --deep).
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            --deep "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # 3. Stage and create .dmg.
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AIS Monitor" -srcfolder dmg-staging \
            -ov -format UDZO dist/ais-monitor-macos-arm64.dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" \
            dist/ais-monitor-macos-arm64.dmg

          # 4. Notarize the DMG (covers the binary inside via hash) and staple.
          xcrun notarytool submit dist/ais-monitor-macos-arm64.dmg \
            --apple-id "$APPLE_ID" \
            --team-id  "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple dist/ais-monitor-macos-arm64.dmg
          xcrun stapler validate dist/ais-monitor-macos-arm64.dmg

          shasum -a 256 dist/ais-monitor-macos-arm64.dmg \
            > dist/ais-monitor-macos-arm64.dmg.sha256

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-macos-arm64
          path: |
            dist/ais-monitor-macos-arm64.dmg
            dist/ais-monitor-macos-arm64.dmg.sha256

  build-windows:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force }
          else { Write-Error "WebView2Loader.dll not found in build output" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc /DMyAppVersion=$version installer\installer.iss
          $exe = "ais-monitor-setup-$version.exe"
          $hash = (Get-FileHash "dist\$exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File "dist\$exe.sha256" -Encoding ASCII
          Write-Host "Installer: dist\$exe ($([math]::Round((Get-Item dist\$exe).Length/1MB,1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-windows
          path: |
            dist\ais-monitor-setup-*.exe
            dist\ais-monitor-setup-*.exe.sha256

  build-linux:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest

    # x86_64 only — cross-compiling GTK/WebKit for ARM64 Linux requires a full
    # ARM64 sysroot which is impractical on ubuntu-latest runners.

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package tar.gz
        run: |
          NAME="ais-monitor-linux-x86_64"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          cp target/x86_64-unknown-linux-gnu/release/ais-monitor "$DIST/"
          cp scripts/setup-linux.sh "$DIST/"
          chmod +x "$DIST/setup-linux.sh"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-linux-x86_64
          path: |
            ais-monitor-linux-x86_64.tar.gz
            ais-monitor-linux-x86_64.tar.gz.sha256

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          FILES=$(find artifacts -type f | tr '\n' ' ')

          gh release create "$TAG" \
            --title "ais-monitor $TAG" \
            --notes "$(cat <<'EOF'
          ## Installation

          ### macOS (Apple Silicon)
          Download `ais-monitor-macos-arm64.dmg`, open it, and drag AIS Monitor to /Applications.
          Signed with Apple Developer ID and notarized — opens with a normal double-click.

          ### Windows
          Download the `ais-monitor-setup-<version>.exe` from this release and run it.

          ### Linux (x86_64)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ais-monitor-linux-x86_64.tar.gz | tar xz
          cd ais-monitor-linux-x86_64
          sudo ./setup-linux.sh && ./ais-monitor
          ```

          ### Linux (arm64)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ais-monitor-linux-arm64.tar.gz | tar xz
          cd ais-monitor-linux-arm64
          sudo ./setup-linux.sh && ./ais-monitor
          ```
          EOF
          )" \
            $FILES
