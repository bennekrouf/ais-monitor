name: Build Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config \
            ${{ matrix.arch == 'arm64' && 'gcc-aarch64-linux-gnu' || '' }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz
        run: |
          NAME="ais-monitor-linux-${{ matrix.arch }}"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          cp target/${{ matrix.target }}/release/ais-monitor "$DIST/"
          cp scripts/setup-linux.sh "$DIST/"
          chmod +x "$DIST/setup-linux.sh"
          cp README.md "$DIST/"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
          echo "sha256: $(sha256sum "$NAME.tar.gz")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-monitor-linux-${{ matrix.arch }}
          path: ais-monitor-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30
