[package]
name = "ais-monitor-core"
version = "0.1.0"
edition = "2021"
description = "Shared services (chain discovery, Azure CLI, KPIs) for AIS Monitor frontends"

[dependencies]
ais-chain = { git = "https://github.com/Bennekrouf/ais-chain" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
