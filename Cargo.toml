[workspace]
members = ["crates/core", "crates/tui"]

# Workspace-wide version: every crate (root + tui + core) inherits via
# `version.workspace = true`. This is the single source of truth — bump
# it in one place and the GUI title, TUI header, installer, and crate
# manifests all stay in sync. The release script targets this line.
[workspace.package]
version = "0.3.45"

[package]
name = "ais-monitor"
version.workspace = true
edition = "2021"
license-file = "LICENSE"
description = "Azure Logic Apps chain monitor — discover, test, and debug workflow chains"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# The shared services live here now, so the crypto, HTTP and chain-parsing
# dependencies they need belong to this crate rather than being listed —
# and compiled — twice.
ais-monitor-core = { path = "crates/core" }
dirs = "5"
rfd = "0.15"
dark-light = "1"
arboard = "3"
regex = "1"
urlencoding = "2"

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
base64 = "0.22"
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ── Debug build size ─────────────────────────────────────────────────────────
# Set before this one grows: the sibling Dioxus apps reached 9-10 GB in
# target/ each, and the dependencies were never the problem — in ais-analytics
# the 353 dependency rlibs came to 0.77 GB against 3.99 GB of the app's own
# object files and 5.7 GB of target/debug/incremental. `rsx!` expands into
# deeply nested generic component trees, so with the stock `debug = true`
# every instantiation carries full DWARF.
#
# An application crate is hashed over its whole dependency graph, so each
# dependency change mints a fresh generation of its objects, and Cargo never
# collects the old ones. Line tables keep file:line in panic backtraces, which
# is the part we read; the dependencies get no debuginfo at all. Set
# `debug = 2` here temporarily when you need a real debugger over dependency
# frames.
#
# Profiles only take effect at the workspace root, so this covers crates/core
# and crates/tui too. target/debug/incremental is never pruned, so clear it
# when it grows: `rm -rf target/debug/incremental`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
