[package]
name = "ais-monitor"
version = "0.1.10"
edition = "2021"
description = "Azure Logic Apps chain monitor — discover, test, and debug workflow chains"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ais-chain = { git = "https://github.com/Bennekrouf/ais-chain" }
dirs = "5"
rfd = "0.15"
dark-light = "1"
arboard = "3"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
