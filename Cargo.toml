[workspace]
members = ["crates/core", "crates/tui"]

# Workspace-wide version: every crate (root + tui + core) inherits via
# `version.workspace = true`. This is the single source of truth — bump
# it in one place and the GUI title, TUI header, installer, and crate
# manifests all stay in sync. The release script targets this line.
[workspace.package]
version = "0.3.29"

[package]
name = "ais-monitor"
version.workspace = true
edition = "2021"
license-file = "LICENSE"
description = "Azure Logic Apps chain monitor — discover, test, and debug workflow chains"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ais-chain = { git = "https://github.com/Bennekrouf/ais-chain" }
dirs = "5"
rfd = "0.15"
dark-light = "1"
arboard = "3"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
